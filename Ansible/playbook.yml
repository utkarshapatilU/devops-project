- name: Deploy HTML App
  hosts: servers
  become: yes

  tasks:

    - name: Install dependencies
      apt:
        name:
          - docker.io
          - git
          - python3-pip
        state: present
        update_cache: yes

    - name: Install Docker SDK for Python
      pip:
        name: docker

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Remove old app directory
      file:
        path: /home/ubuntu/app
        state: absent

    - name: Clone app repo from GitHub
      git:
        repo: https://github.com/utkarshapatilU/devops-project.git
        dest: /home/ubuntu/app
        force: yes

    - name: Build Docker image
      docker_image:
        name: html-app
        tag: latest
        source: build
        build:
          path: /home/ubuntu/app/app   

    - name: Remove old container if exists
      docker_container:
        name: html-app
        state: absent
        force_kill: yes

    - name: Run container
      docker_container:
        name: html-app
        image: html-app:latest
        state: started
        restart_policy: always
        published_ports:
          - "80:80"
